name: Fetch clips

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-clips
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch missing YouTube trailers
        run: node scripts/build-clips.mjs

      - name: Commit updated clips.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/clips.json
          if git diff --staged --quiet; then
            echo "No new clips — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update clips.json from GitHub Actions fetch"
          git push
